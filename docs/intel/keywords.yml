# COP32 intel — tiering and automatic grading rules
#
# Everything here is deterministic string matching. No model inference runs in
# the collector. Edit these lists to tune signal; re-run and watch the
# "duplicates/irrelevant skipped" count in the digest.
#
# Matching is case-insensitive and whole-word.

# ---------------------------------------------------------------------------
# subject_terms — an item must mention one of these to reach Tier 1 or 2.
# Without a subject hit, an item can only be Tier 3 or 4 (context/benchmark).
# ---------------------------------------------------------------------------
subject_terms:
  - COP32
  - COP 32
  - COP-32
  - ኮፕ32
  - ኮፕ 32

# ---------------------------------------------------------------------------
# TIER 1 — project-critical. Pushed as an ALERT, appended to ALERTS.md.
# These are the words that would appear in a story announcing the thing that
# makes this project redundant, or the thing that unblocks it.
# ---------------------------------------------------------------------------
tier1_terms:
  - app
  - application
  - mobile app
  - super app
  - platform
  - portal
  - website
  - digital
  - ICT
  - tender
  - RFP
  - procurement
  - bid
  - contract award
  - vendor
  - supplier
  - accreditation
  - registration
  - official dates
  - venue
  - media centre
  - media center
  - press centre
  - volunteer programme
  - volunteer program
  - task force
  - API
  - data portal
  - ድረ ገጽ          # website
  - መተግበሪያ         # application
  - ጨረታ            # tender


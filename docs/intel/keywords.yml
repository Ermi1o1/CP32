# ---------------------------------------------------------------------------
# hard_claim_patterns — regular expressions.
#
# If a NON-OFFICIAL source states one of these, the item is forced to grade F
# (needs verification) no matter how reputable the outlet. This is the rule
# that stops "COP32 runs 8-19 November 2027" entering the archive as a fact
# because an SEO blog said so.
#
# An official source is unaffected: it still grades B.
# ---------------------------------------------------------------------------
hard_claim_patterns:
  # Date ranges: "8-19 November", "8 to 19 November"
  - '\b\d{1,2}\s*(?:-|–|—|to)\s*\d{1,2}\s+(?:Nov|November)\b'
  # Attendance figures: "50,000 participants", "80000 delegates"
  - '\b\d{1,3}[,.]?\d{3}\s+(?:participants|delegates|attendees|visitors)\b'
  - '\b(?:\d{2,3})[,.]?000\s+(?:participants|delegates|attendees)\b'
  # Assertions of confirmation
  - '\b(?:officially )?confirmed\s+(?:dates|venue|that)\b'
  - '\bvenue\s+(?:is|will be|has been)\s+(?:confirmed|announced|set)\b'
  - '\bdates\s+(?:are|have been)\s+(?:confirmed|announced|set|fixed)\b'
  # Budget / money figures attached to COP32
  - '\b(?:USD|\$|birr|ETB)\s?\d[\d,.]*\s?(?:million|billion|bn|m)\b'
  # Claims of an official app or partnership existing
  - '\bofficial\s+(?:COP32\s+)?(?:app|application|platform|portal)\b'
  - '\b(?:signed|awarded)\s+(?:a\s+)?(?:contract|agreement|MoU)\b'

# ---------------------------------------------------------------------------
# limits — volume control. Added 2026-11-09 after the first live run produced
# a 188-item digest nobody could read.
# ---------------------------------------------------------------------------
limits:
  # Ignore anything published longer ago than this. Feeds and search endpoints
  # serve old items freely; the first run surfaced an app from 2005.
  # Page changes and app listings are exempt (see collect.py).
  max_age_days: 14

  # Tiers 1 and 2 are never trimmed. Tiers 3 and 4 are background: keep the
  # newest few and let the rest go. Raise these if the digest feels thin.
  tier3_max: 8
  tier4_max: 6

name: COP32 intel collector

# Runs once a day and commits the result back to main.
#
# Netlify: the commit message contains "[skip netlify]", so pushing this does
# NOT trigger a site build and does NOT consume Netlify free-tier build
# minutes. See D60/D61 and docs/intel/README.md.
#
# GitHub Actions minutes: this job is capped at 10 minutes and typically runs
# in 1-3. At ~2 min/day that is roughly 60 of the 2,000 free private-repo
# minutes per month.

on:
  schedule:
    # 03:23 UTC = 06:23 EAT. Off-the-hour on purpose: scheduled jobs queued at
    # :00 are the most likely to be delayed by GitHub's own load.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'normal'
        type: choice
        options: [normal, verify, dry-run]

permissions:
  contents: write     # to commit the queue and digest
  issues: write       # to open the alert issue

concurrency:
  group: intel
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/intel/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/intel/requirements.txt

      - name: Run the collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          case "${{ github.event.inputs.mode || 'normal' }}" in
            verify)  python3 docs/intel/collect.py --verify ;;
            dry-run) python3 docs/intel/collect.py --dry-run ;;
            *)       python3 docs/intel/collect.py ;;
          esac

      - name: Commit results
        run: |
          git config user.name  "cop32-intel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage ONLY docs/intel. Never `git add -A` — prototype/ must never
          # be touched by this job (constraint C1).
          git add docs/intel
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "intel: $(date -u +%F) collection [skip netlify]"
            git push
          fi

      - name: Guard — prototype must be untouched
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^prototype/'; then
            echo "::error::This job modified prototype/. That must never happen."
            exit 1
          fi
          echo "prototype/ untouched."

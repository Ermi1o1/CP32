# Checks for the native app (Phase 22). Runs on pull requests only. No build, no deploy.
name: App checks
on:
  pull_request:
    paths: ['app/**', 'docs/design/tokens.json', 'docs/design/build_tokens.py', '.github/workflows/app-check.yml']
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Design tokens pass contrast and the generated theme is current
        run: |
          cd ../docs/design && python3 build_tokens.py
          git diff --exit-code -- tokens.json ../../app/src/theme/tokens.generated.ts
      - name: TypeScript (strict)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: No tracking or advertising packages (D21)
        run: |
          ! grep -E '"(@?firebase[^"]*analytics|@react-native-firebase/analytics|react-native-fbsdk[^"]*|@segment/[^"]*|expo-ads-[^"]*|react-native-google-mobile-ads|@amplitude/[^"]*|mixpanel[^"]*|appsflyer[^"]*|@sentry/[^"]*|react-native-adjust)"' package.json

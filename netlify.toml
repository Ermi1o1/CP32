# Netlify deploy configuration for the COP32 prototype.
#
# WHY publish = "prototype":
# Without it Netlify uploads the WHOLE repo root and serves it publicly — which
# means docs/, deliverables/ (incl. the proposal .docx) and spikes/ end up on a
# public URL even though this GitHub repo is private, and "/" 404s because the
# repo root has no index.html. Publishing only /prototype fixes both.
#
# WHY this build command:
# It is the same stale-cache guard the retired GitHub Pages workflow ran. If the
# prototype's version carriers disagree, the build fails and NOTHING publishes —
# the previous deploy stays live. Keeps phones from getting a half-updated PWA.
#
# This file overrides the build settings in the Netlify UI, so the deploy stays
# correct even if someone changes them in the dashboard.

# WHAT THE BUILD COMMAND DOES, in order:
#   1. Version guard — if the prototype's version carriers disagree the build
#      fails and NOTHING publishes; the previous deploy stays live.
#   2. Strips dev-only files from the BUILD COPY so they are never uploaded to
#      the CDN. This does not touch the repo — only what gets published. Keep
#      the `rm` after the `--check`, since the check runs release.py itself.
# None of the stripped files are referenced by index.html, app.js or sw.js, so
# removing them cannot break the service worker install. Re-verify that before
# adding anything to the list.
#
# WHY the ignore command:
# Netlify skips the build when this command exits 0. It exits 0 only when
# nothing outside docs/, deliverables/, spikes/ and app/ (the native app, which
# Netlify does not publish) changed since the LAST
# DEPLOYED commit ($CACHED_COMMIT_REF), so the daily intel commits and doc-only
# pushes never use build minutes. It compares against the last deploy, not
# HEAD^, so a push that holds a prototype change plus a later docs-only commit
# still builds. If $CACHED_COMMIT_REF is missing, git errors (non-zero) and the
# build runs, so it fails open, never closed.

[build]
  publish = "prototype"
  command = "python3 prototype/release.py --check && rm -f prototype/README.md prototype/build.py prototype/release.py"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs' ':!deliverables' ':!spikes' ':!app'"
